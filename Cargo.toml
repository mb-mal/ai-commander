[package]
name = "ai-commander"
version = "0.1.0"
edition = "2024"
description = "ChatGPT-style TUI for AI agent harnesses (opencode, ...) with NC-era aesthetics"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
# No TLS feature on purpose: harnesses run on localhost http, and TLS backends
# (aws-lc-rs) need a C toolchain. Add `rustls` feature back if you need https.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
eventsource-stream = "0.2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
dirs = "6"
async-trait = "0.1"
anyhow = "1"
getrandom = "0.3"
which = "8"

[profile.release]
lto = true
strip = true
