[package]
name = "ai-commander"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "ChatGPT-style TUI for AI agent harnesses (opencode, hermes, deepseek-harness) with Norton-Commander aesthetics"
license = "MIT"
repository = "https://github.com/mb-mal/ai-commander"
homepage = "https://github.com/mb-mal/ai-commander"
readme = "README.md"
keywords = ["tui", "ai", "agent", "chat", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# No TLS feature on purpose: harnesses run on localhost http, and TLS backends
# (aws-lc-rs) need a C toolchain. Add `rustls` feature back if you need https.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
eventsource-stream = "0.2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
dirs = "6"
async-trait = "0.1"
anyhow = "1"
getrandom = "0.3"
which = "8"
agent-client-protocol = "1.0.1"
unicode-segmentation = "1.13.3"
redb = "2.6.4"
serde_norway = "0.9.42"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rmcp = { version = "3.9", features = ["server", "transport-io"] }
schemars = "1.0"

[profile.release]
lto = true
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
